name: Quantize LLMs/VLMs and Upload Checkpoint to AWS

# Scaffold only. The real steps (quantize + zip + S3 upload) land in a follow-up
# PR that replaces the placeholder job below with a call into
# gpu_pod_lifecycle.yml. Merged early so the workflow is registered on the
# default branch and can be dispatched against a development branch.

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'LLM/VLM folder name under src/qai_hub_models/models, e.g. qwen3_0_6b. Must set separate_quantize_script: true in its manifest.yaml.'
        required: true
        type: string

      precision:
        description: |
          Forwarded to quantize.py as --precision, which resolves the recipe
          from the model's manifest.yaml lm_quantization_details (SpinQuant /
          AdaScale / Calibration settings and their datasets). Also used in
          the S3 key: ephemeral_quantize_assets/<model_id>/<precision>/ in the
          existing QAIHM private S3 bucket (same bucket + role as scorecard's
          ephemeral_test_assets/pre_release_assets uploads, no separate
          bucket). Auto-purged by the ephemeral_quantize_assets/ lifecycle
          rule on that bucket, mirroring ephemeral_test_assets/.
        required: false
        default: w4a16
        type: choice
        options:
          - w4a16
          - w4

      unquantized_checkpoint:
        description: HuggingFace repo id or local path to the unquantized source weights, passed to the model's quantize.py as --checkpoint
        required: false
        default: DEFAULT_UNQUANTIZED
        type: string

      quantize_args:
        description: |
          Extra args forwarded as-is to the model's quantize.py. The
          quantization recipe itself comes from manifest.yaml (see precision
          above), so this is only for the knobs that are not in the manifest:
          --context-length, --calibration-sequence-length, and for VLMs
          --skip-llm / --skip-veg. Usually left empty.
        required: false
        default: ''
        type: string

jobs:
  upload_encoding_assets:
    name: Quantize & Upload Encoding Assets
    runs-on: [tetra-ubuntu-2204, self-hosted]
    steps:
      - name: Placeholder
        shell: bash
        run: |
          echo "Scaffold only -- no work performed."
          echo "model_id=${{ inputs.model_id }}"
          echo "precision=${{ inputs.precision }}"
          echo "unquantized_checkpoint=${{ inputs.unquantized_checkpoint }}"
          echo "quantize_args=${{ inputs.quantize_args }}"
